services:
  betteragents-dashboard:
    image: node:20-alpine
    container_name: betteragents-${BETTERAGENTS_PROJECT:-dashboard}
    command: node /app/serve-dashboard.js
    ports:
      - "${BETTERAGENTS_PORT:-3000}:3000"
    volumes:
      - ./.betteragents/memory:/memory:ro
      - ./.betteragents/templates:/templates:ro
      - ./.betteragents/scripts/serve-dashboard.js:/app/serve-dashboard.js:ro
    environment:
      - MEMORY_DIR=/memory
      - TEMPLATES_DIR=/templates
      - PORT=3000
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000 || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
